<header>
  <nav class="nav-pill glass">
    <a href="#about">Sobre</a>
    <a href="#projects">Projetos</a>
    <a href="#contact">Contato</a>
  </nav>
  <button class="theme-switch" (click)="themeService.toggle()"
    [attr.aria-label]="'Mudar para tema ' + (themeService.theme() === 'dark' ? 'claro' : 'escuro')">
    <span class="theme-switch__thumb" [class.theme-switch__thumb--dark]="themeService.theme() === 'dark'"></span>
    <svg class="icon" [class.icon--active]="themeService.theme() === 'light'" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
    <svg class="icon" [class.icon--active]="themeService.theme() === 'dark'" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>
</header>
